<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- 摄像头图标 (居中) -->
  <g transform="translate(256,240)" fill="none" stroke="#3498db" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- 镜头主体 -->
    <rect x="-100" y="-70" width="200" height="140" rx="24" ry="24" fill="#3498db" fill-opacity="0.15"/>
    <!-- 镜头外圈 -->
    <circle cx="0" cy="0" r="48"/>
    <!-- 镜头内圈 -->
    <circle cx="0" cy="0" r="28" fill="#3498db" fill-opacity="0.3"/>
    <!-- 取景器高光 -->
    <circle cx="-8" cy="-10" r="8" fill="#fff" fill-opacity="0.3"/>
    <!-- 顶部指示灯 -->
    <circle cx="0" cy="-84" r="6" fill="#2ecc71"/>
  </g>
  <!-- 笔/批注指示 -->
  <g transform="translate(310,340) rotate(-30)">
    <line x1="0" y1="30" x2="50" y2="-20" stroke="#e74c3c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="52" cy="-24" r="10" fill="#e74c3c"/>
  </g>
  <!-- 底部文字: 展台 -->
  <text x="256" y="400" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="600" fill="#fff" opacity="0.9">展台</text>
</svg>
